server:
  port: 8080

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${SPRING_DATASOURCE_USERNAME:scheduler}
    password: ${SPRING_DATASOURCE_PASSWORD:scheduler}
    hikari:
      maximum-pool-size: 20
  mvc:
    servlet:
      load-on-startup: 1          # initialise the web layer at startup
  jpa:
    hibernate:
      ddl-auto: none          # schema.sql owns the schema
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info